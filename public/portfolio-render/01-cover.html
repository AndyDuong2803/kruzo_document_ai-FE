<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1024,initial-scale=1" />
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1024px;height:768px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#172033;background:#f6f8fc}
    .stage{position:relative;width:1024px;height:768px;padding:64px 56px;background:radial-gradient(circle at 84% 12%,#dbe9ff 0,transparent 29%),linear-gradient(135deg,#fff 0%,#f4f7fc 66%,#edf3ff 100%)}
    .bar{position:absolute;left:0;top:0;width:12px;height:100%;background:#2864dc}
    .eyebrow{font-size:15px;font-weight:700;letter-spacing:.12em;color:#2864dc;text-transform:uppercase;margin-bottom:24px}
    h1{font-size:56px;line-height:1.02;letter-spacing:-.045em;margin:0;width:455px}
    .secondary{font-size:28px;line-height:1.25;font-weight:600;color:#43506a;margin:22px 0 0;width:430px}
    .support{font-size:17px;font-weight:700;color:#2864dc;margin-top:36px}
    .proof{position:absolute;left:56px;bottom:64px;display:flex;align-items:center;gap:10px;font-size:14px;color:#5b667c}
    .dot{width:9px;height:9px;border-radius:50%;background:#25a56a;box-shadow:0 0 0 4px #dff5eb}
    .window{position:absolute;right:44px;top:76px;width:492px;height:560px;border:1px solid #cbd4e3;border-radius:20px;background:white;box-shadow:0 24px 70px rgba(36,60,104,.18);overflow:hidden}
    .chrome{height:45px;border-bottom:1px solid #dfe5ef;background:#f7f9fc;display:flex;align-items:center;padding:0 15px;gap:7px}
    .chrome i{display:block;width:9px;height:9px;border-radius:50%;background:#c9d1df}.chrome i:first-child{background:#ff7b70}.chrome i:nth-child(2){background:#f7c84b}.chrome i:nth-child(3){background:#4ac47a}
    .url{margin-left:10px;height:25px;flex:1;border-radius:7px;background:#fff;border:1px solid #e2e7ef;color:#7a8497;font-size:11px;display:flex;align-items:center;padding:0 10px}
    .shot{position:relative;height:515px;overflow:hidden;background:#f8fafc}
    .shot img{position:absolute;width:760px;height:auto;left:-4px;top:-120px}
    .badge{position:absolute;right:64px;bottom:90px;padding:10px 14px;border-radius:999px;background:#172033;color:#fff;font-size:12px;font-weight:700;box-shadow:0 8px 24px rgba(23,32,51,.22)}
  </style>
</head>
<body><main class="stage"><div class="bar"></div>
  <div class="eyebrow">Kruzo Document AI</div>
  <h1>AI Invoice<br/>Automation</h1>
  <p class="secondary">PDF invoices to Excel and JSON</p>
  <p class="support">Batch Processing · Line Items · OCR API</p>
  <div class="proof"><span class="dot"></span>Real extraction workflow · Fictional sample data</div>
  <section class="window"><div class="chrome"><i></i><i></i><i></i><div class="url">localhost:3000/upload</div></div><div class="shot"><img src="assets/run-summary.png" alt="Real Kruzo Document AI result"/></div></section>
  <div class="badge">Excel-ready output</div>
</main></body></html>
